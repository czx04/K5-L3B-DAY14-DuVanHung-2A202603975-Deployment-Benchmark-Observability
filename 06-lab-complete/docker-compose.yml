# ============================================================
# Agent + Redis bằng một lệnh:
#   cp .env.example .env   # điền AGENT_API_KEY
#   docker compose -p k5-day14-final up --build
#   curl http://localhost:8000/health
# ============================================================
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # không có .env vẫn chạy được (đặt biến qua shell)
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
