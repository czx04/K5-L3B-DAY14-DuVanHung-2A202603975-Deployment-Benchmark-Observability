# ============================================================
# Render Blueprint — agent (Docker) + Render Key Value (Redis-compatible)
# Dashboard → New → Blueprint → chọn repo → Blueprint Path: 06-lab-complete/render.yaml
# AGENT_API_KEY (sync: false) được nhập tay ở dashboard — không ghi giá trị ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: MONTHLY_BUDGET_USD
        value: "10"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []            # chỉ cho service trong cùng tài khoản Render kết nối (mạng nội bộ)
    maxmemoryPolicy: noeviction
