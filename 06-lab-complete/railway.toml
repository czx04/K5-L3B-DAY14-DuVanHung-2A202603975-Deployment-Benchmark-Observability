# ============================================================
# Railway — build từ Dockerfile, health check /health.
# App lắng nghe $PORT do Railway cấp (CMD trong Dockerfile dùng ${PORT:-8000}).
# Biến AGENT_API_KEY, REDIS_URL (=${{Redis.REDIS_URL}}) đặt trong Railway dashboard / `railway variables`.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
